# Mining/gathering (miner): natural blocks below mine-max-y anywhere in the area; above it only inside
# mine-shafts (staircase entrances) or blocks whose name ends with a gather-anywhere entry (tree logs).
# Never near lava/water, containers, bedrock or agent-built blocks.
allow-mine: true
mine-max-y: 50
# Staircase entrance west of spawn: dig "stairs" west from 262,69,112 (22 steps reaches y=47).
mine-shafts:
- x1: 239
  z1: 111
  x2: 262
  z2: 113
gather-anywhere:
- _LOG
- _LEAVES
# Farming (farmer): till/plant/harvest anywhere in the area; only agent-planted crops are harvested.
allow-farm: true
# Trading (right-click a bot empty-handed). Base prices; anything else is valued from its crafting
# or smelting recipe (e.g. an iron pickaxe = 3 iron ingots + 2 sticks), falling back to 1.
