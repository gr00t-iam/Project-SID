max-agents: 22
# Empty world selects the first loaded world. Coordinates below are not used unless configured-spawn is true.
world: ''
configured-spawn: true
spawn:
  x: 272.5
  y: 69.0
  z: 96.5
# Keep the simulation inside a bounded area around spawn. Every chunk in this area must be
# force-loaded (see DEPLOY-NOW.md): since 1.21.9 spawn chunks are not kept loaded, and
# Citizens will not spawn or keep an NPC in an unloaded chunk while no player is nearby.
roam-radius: 0
loaded-radius: 112
allow-attack: true
allow-interact: true
# Building: agents place only allowlisted blocks into air/grass inside roam-radius, within
# build-reach of themselves, and may break only blocks an agent placed (agent-blocks.json).
